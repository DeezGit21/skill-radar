[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-radar"
version = "1.2.0"
description = "AI Agent Skill Discovery Tool — finds relevant skills, MCP servers, and tools for any task"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
skill-radar = "skill_radar:main"